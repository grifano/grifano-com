<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page Not Found — Serhii Orlenko</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link href="css/normalize.css" rel="stylesheet" type="text/css" />
    <link href="css/portfolio-custom.css" rel="stylesheet" type="text/css" />
    <link href="images/favicon.svg" rel="shortcut icon" type="image/x-icon" />
    <link href="images/webclip.svg" rel="apple-touch-icon" />
    <style>
      .error-page-wrapper {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .error-content-section {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-block: 80px;
      }
      .error-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 48px 36px;
        max-width: 520px;
        width: 100%;
        text-align: center;
        box-shadow: 0 12px 36px rgba(23, 32, 51, 0.05);
      }
      .error-code {
        font-family: var(--font-headline);
        font-size: 72px;
        font-weight: 700;
        color: var(--primary);
        line-height: 1;
        margin-bottom: 12px;
      }
      .error-title {
        font-size: 26px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .error-description {
        font-size: 16px;
        line-height: 1.6;
        color: var(--secondary);
        margin: 0 0 28px 0;
      }
      .error-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body class="error-page-wrapper">
    <header class="custom-header">
      <div class="site-wrapper custom-nav-container">
        <a href="index.html" class="custom-wordmark" aria-label="Serhii Orlenko Home">
          Serhii<span>.</span>Orlenko
        </a>
        <nav aria-label="Primary Navigation">
          <ul class="custom-nav-links">
            <li><a href="index.html#selected-work">Work</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#evidence">Track Record</a></li>
            <li><a href="index.html#contact">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="error-content-section">
      <div class="site-wrapper">
        <div class="error-card">
          <div class="error-code">404</div>
          <h1 class="error-title">Page Not Found</h1>
          <p class="error-description">
            The page you are looking for doesn’t exist, has been moved, or the URL might be outdated.
          </p>
          <div class="error-actions">
            <a href="index.html" class="custom-button">
              Go to Home <span class="arrow" aria-hidden="true">→</span>
            </a>
            <a href="index.html#selected-work" class="custom-button secondary">
              View Work
            </a>
          </div>
        </div>
      </div>
    </main>

    <footer class="custom-footer">
      <div class="site-wrapper footer-content">
        <div class="custom-wordmark">
          Serhii<span>.</span>Orlenko
        </div>
        <div style="font-size: 13px; color: var(--secondary);">
          © 2026 Serhii Orlenko. All rights reserved.
        </div>
      </div>
    </footer>
  </body>
</html>
